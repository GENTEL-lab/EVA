name: External resources

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/check_resource_links.py'
      - 'examples/reproduction/release/resource_links.json'
      - '.github/workflows/resources.yml'

permissions:
  contents: read

jobs:
  accessibility:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Record availability independently of CPU regression status
        run: python scripts/check_resource_links.py --output resource-access.json
      - name: Show observed access failures
        run: |
          python - <<'PYREPORT'
          import json, os
          report = json.load(open('resource-access.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"## Resource access\n\n{report['available']}/{report['total']} endpoints available. This is an access report, not model validation.\n\n")
              for item in report['checks']:
                  if item['access'] != 'AVAILABLE':
                      summary.write(f"- {item['id']}: {item['access']} ({item.get('http_status', item.get('error', 'unknown'))})\n")
          PYREPORT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: external-resource-access
          path: resource-access.json
