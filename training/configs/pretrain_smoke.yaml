# Synthetic engineering smoke only. NOT a recovered paper training recipe.
data_config:
  train_file: tests/data/train_smoke.fasta
  lineage_file: null
  max_seq_length: 128
  use_chunked: false
  use_direction_tokens: true
  use_lineage_prefix: false
  use_rna_type_prefix: true
  enable_reverse_augmentation: false
  mode: mixed
  glm_probability: 0.333
model_config:
  hidden_size: 64
  num_hidden_layers: 2
  num_attention_heads: 4
  num_key_value_heads: 4
  intermediate_size: 128
  max_position_embeddings: 256
  num_experts: 2
  num_experts_per_tok: 1
  moe_implementation: megablocks
  moe_world_size: 1
  use_cache: false
  router_aux_loss_coef: 0.01
training_config:
  output_token_mask: none
  output_dir: results/pretrain_smoke
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 0.0001
  max_epochs: 1
  max_steps: 2
  dataloader_num_workers: 0
  bf16: true
  seed: 42
logging_config:
  log_dir: results/pretrain_smoke/logs
  enable_wandb: false
memory_config:
  enable_monitoring: false
