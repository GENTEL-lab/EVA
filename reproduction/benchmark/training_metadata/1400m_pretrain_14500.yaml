    hidden_size: 1024
    intermediate_size: 3072
    num_attention_heads: 16
    num_hidden_layers: 26
    num_key_value_heads: 16
training_config:
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1e-8
  bf16: true
  dataloader_drop_last: true
  dataloader_num_workers: 8
  dataloader_pin_memory: true
  fp16: false
  gradient_accumulation_steps: 16
  gradient_checkpointing: false
  learning_rate: 0.0001
  logging_steps: 30
  max_epochs: 1
  max_wall_time_hours: 150
  min_lr_ratio: 0.1
  output_dir: /rna-multiverse/results/experiments/scaling_1.4B_v24_mixed_glm_stage1_20251126
  per_device_train_batch_size: 4
  run_name: scaling_1.4B_v24_mixed_glm_stage1
  save_steps: 500
  seed: 42
  warmup_steps: 3000
  weight_decay: 5.0e-06
training_strategies:
  fast:
    learning_rate: 2e-3
    warmup_ratio: 0.05
  fine:
    learning_rate: 1e-4
    warmup_ratio: 0.15
  stable:
    learning_rate: 5e-4
    warmup_ratio: 0.1
