# Model Configuration
models:
  # HuggingFace Models (6 models)
  rnafm:
    type: huggingface
    model_name: multimolecule/rnafm
    tokenizer_name: multimolecule/rnafm
    model_class: MaskedLM
    sequence_type: rna
    likelihood_method: pseudo_likelihood
    conda_env: hf_model
    trust_remote_code: true
    local_path: /data/yanjie_huang/rna_benchmark/biombenchmark/eva_fitness_benchmark/huggingface_cache/hub/models--multimolecule--rnafm/snapshots/2a98c38e8219d666ad35d04a689218ab50a36293
    batch_size: 4
    full_mask_max_length: 256
    mask_chunk_size: 256

  rnabert:
    type: huggingface
    model_name: multimolecule/rnabert
    tokenizer_name: multimolecule/rnabert
    model_class: MaskedLM
    sequence_type: rna
    likelihood_method: pseudo_likelihood
    conda_env: hf_model
    trust_remote_code: true
    local_path: /data/yanjie_huang/rna_benchmark/biombenchmark/eva_fitness_benchmark/huggingface_cache/hub/models--multimolecule--rnabert/snapshots/7a9b5d5d5a96931ff056828c0968479098506cea
    batch_size: 4

  rnamsm:
    type: huggingface
    model_name: multimolecule/rnamsm
    tokenizer_name: multimolecule/rnamsm
    model_class: MaskedLM
    sequence_type: rna
    likelihood_method: pseudo_likelihood
    conda_env: hf_model
    trust_remote_code: true
    local_path: /data/yanjie_huang/rna_benchmark/biombenchmark/eva_fitness_benchmark/huggingface_cache/hub/models--multimolecule--rnamsm/snapshots/ad61a4915674596557b3c3c4fe4fd7162d36acc8
    batch_size: 1
    full_mask_max_length: 256
    mask_chunk_size: 256

  rinalmo:
    type: huggingface
    model_name: multimolecule/rinalmo
    tokenizer_name: multimolecule/rinalmo
    model_class: MaskedLM
    sequence_type: rna
    likelihood_method: pseudo_likelihood
    conda_env: hf_model
    trust_remote_code: true
    local_path: /data/yanjie_huang/rna_benchmark/biombenchmark/eva_fitness_benchmark/huggingface_cache/hub/models--multimolecule--rinalmo-giga/snapshots/8df4cd32d1527aa4556dca121f17ad9df8256084
    batch_size: 4
    full_mask_max_length: 512
    mask_chunk_size: 128

  gena:
    type: huggingface
    model_name: AIRI-Institute/gena-lm-bert-base
    tokenizer_name: AIRI-Institute/gena-lm-bert-base
    model_class: MaskedLM
    sequence_type: dna
    likelihood_method: pseudo_likelihood
    conda_env: hf_model
    trust_remote_code: true
    local_path: /data/yanjie_huang/biollm_benchmark/huggingface_cache/hub/models--AIRI-Institute--gena-lm-bert-base-t2t-multi/snapshots/4633e5a1ada905bb7afee6877d71cc12578a95a5
    batch_size: 2

  grover:
    type: huggingface
    model_name: PoetschLab/GROVER
    tokenizer_name: PoetschLab/GROVER
    model_class: MaskedLM
    sequence_type: dna
    likelihood_method: pseudo_likelihood
    conda_env: hf_model
    trust_remote_code: true
    local_path: /data/yanjie_huang/biollm_benchmark/huggingface_cache/hub/models--PoetschLab--GROVER/snapshots/6b223110f0d6963e849f55bc2a2f3cff0e38c7a4
    batch_size: 4

  # Special Models (4 models)
  ernie_rna:
    type: custom
    adapter: ernie_rna_adapter
    model_path: /data/yanjie_huang/rna_benchmark/biombenchmark/eva_fitness_benchmark/model/ERNIE-RNA
    checkpoint: checkpoint/ERNIE-RNA_checkpoint/ERNIE-RNA_pretrain.pt
    max_seq_length: 1022
    python_path: /home/huangyanjie/miniconda3/envs/hf_model/bin/python

  evo2_1b:
    type: custom
    adapter: evo_adapter
    model_name: evo2_1b_base
    python_path: /usr/bin/python3

  evo2_7b:
    type: custom
    adapter: evo_adapter
    model_name: evo2_7b_base
    python_path: /usr/bin/python3

  evo2_40b:
    type: custom
    adapter: evo_adapter
    model_name: evo2_40b_base
    checkpoint_name: evo2_40b_base
    python_path: /usr/bin/python3
    gpu_requirement: 2

  codonfm_600m:
    type: docker
    adapter: codonfm_adapter
    container_name: codon-fm-dev-container
    model_size: 600m

  codonfm_1b:
    type: docker
    adapter: codonfm_adapter
    container_name: codon-fm-dev-container
    model_size: 1b

  aido:
    type: custom
    adapter: aido_adapter
    model_path: /data/yanjie_huang/biollm_benchmark/model/AIdo.RNA/model-weight
    project_root: /data/yanjie_huang/biollm_benchmark/model/AIdo.RNA/ModelGenerator-main
    python_path: /home/huangyanjie/miniconda3/envs/AIDO/bin/python
    batch_size: 8

  generrna:
    type: custom
    adapter: generrna_adapter
    ckpt_path: /data/yanjie_huang/biollm_benchmark/model/GenerRNA/model_updated.pt
    tokenizer_path: /data/yanjie_huang/biollm_benchmark/model/GenerRNA/tokenizer
    python_path: /usr/bin/python3

  codongpt:
    type: custom
    adapter: codongpt_adapter
    python_path: /home/huangyanjie/miniconda3/envs/hf_model/bin/python

  gc_content:
    type: custom
    adapter: simple_baseline_adapter
    baseline: gc_content
    likelihood_method: gc_content
    sequence_type: rna
    batch_size: 1024

  cai:
    type: custom
    adapter: simple_baseline_adapter
    baseline: cai
    likelihood_method: cai
    sequence_type: coding_rna
    species: homo_sapiens
    codon_usage_table: /data/yanjie_huang/rna_benchmark/biombenchmark/eva_fitness_benchmark/references/codon_usage_tables.json
    codon_usage_source: "Codon Usage Database (Kazusa) and literature; copied from benchmark_protein_dms/dna_rna_tools/codon_usage_tables.json"
    batch_size: 1024

  # EVA RNA Models (Docker-based, independent container per task)
  # Uses score_worker.py which automatically adds 5'/3' direction tokens
  # and excludes them from log-likelihood calculation
  # NOTE: EVA models are commented out - requires rnagen-with-web Docker image not available on this server
  eva_1.4b:
    type: docker
    adapter: eva_rna_adapter
    checkpoint: /data/yanjie_huang/rna_benchmark/EVA_checkpoint/1400M_1204_mid/checkpoint-25500
    python_path: /composer-python/python3
    batch_size: 128

